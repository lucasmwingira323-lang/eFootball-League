<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eFOOTBALL LEAGUE</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #111;
    }

    header {
      background: #075e2b;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin-top: 8px;
    }

    .container {
      max-width: 500px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #075e2b;
      color: white;
      font-size: 17px;
      margin-top: 10px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    label {
      font-weight: bold;
    }

    .notice {
      background: #fff3cd;
      padding: 12px;
      border-radius: 10px;
      margin: 15px 0;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>🏆 eFOOTBALL LEAGUE</h1>
  <p>⚽ 1v1 Online Competition</p>
</header>

<div class="container">

  <div class="card" id="home">
    <h2>Karibu eFOOTBALL LEAGUE</h2>
    <p>Jiunge na mashindano ya 1v1 ya eFootball.</p>

    <button onclick="showRegister()">📝 JISAJILI</button>
    <button onclick="showMessage('🏆 League Table itakuja hapa.')">
      🏆 LEAGUE TABLE
    </button>
    <button onclick="showMessage('📅 Fixtures zitakuja hapa.')">
      📅 FIXTURES
    </button>
    <button onclick="showMessage('📊 Results zitaonekana hapa.')">
      📊 RESULTS
    </button>
  </div>

  <div class="card hidden" id="register">

    <h2>📝 Usajili wa Mchezaji</h2>

    <label>Jina Kamili</label>
    <input id="playerName" type="text" placeholder="Andika jina lako">

    <label>eFootball Username</label>
    <input id="username" type="text" placeholder="Andika username yako">

    <label>Namba ya WhatsApp</label>
    <input id="whatsapp" type="tel" placeholder="Mfano: 07XXXXXXXX">

    <div class="notice">
      ⚠️ Tumia akaunti yako mwenyewe ya eFootball/KONAMI
      na kikosi chako mwenyewe.<br><br>
      🚫 Usiweke password yako hapa.
    </div>

    <label>
      <input id="ownAccount" type="checkbox" style="width:auto;">
      Ninathibitisha kuwa natumia akaunti yangu na kikosi changu mwenyewe.
    </label>

    <button onclick="submitRegistration()">✅ JISAJILI</button>
    <button onclick="goHome()">⬅️ RUDI</button>

  </div>

</div>

<footer>
  eFOOTBALL LEAGUE © 2026
</footer>

<script>

const SUPABASE_URL = "https://hhobdbhdaesvlxzjvsfh.supabase.co";

const SUPABASE_KEY = "sb_publishable_VJGlxIhg6uTndMLhYJR2mw_e4ApXVdi";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function submitRegistration() {

  const playerName =
    document.getElementById("playerName").value.trim();

  const username =
    document.getElementById("username").value.trim();

  const whatsapp =
    document.getElementById("whatsapp").value.trim();

  const ownAccount =
    document.getElementById("ownAccount").checked;

  if (!playerName || !username || !whatsapp) {
    alert("⚠️ Tafadhali jaza taarifa zote.");
    return;
  }

  if (!ownAccount) {
    alert("⚠️ Tafadhali thibitisha kuwa unatumia akaunti na kikosi chako mwenyewe.");
    return;
  }

  const { error } = await supabaseClient
    .from("players")
    .insert([
      {
        player_name: playerName,
        username: username,
        whatsapp: whatsapp,
        own_account: true
      }
    ]);

  if (error) {
    console.error(error);
    alert("❌ Usajili umeshindikana. Jaribu tena.");
    return;
  }

  alert("🎉 Umefanikiwa kujisajili kwenye eFOOTBALL LEAGUE!");

  document.getElementById("playerName").value = "";
  document.getElementById("username").value = "";
  document.getElementById("whatsapp").value = "";
  document.getElementById("ownAccount").checked = false;

  goHome();
}

function showRegister() {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("register").classList.remove("hidden");
}

function goHome() {
  document.getElementById("register").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
}

function showMessage(message) {
  alert(message);
}

</script>

</body>
</html>
