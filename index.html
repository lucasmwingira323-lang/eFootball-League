<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eFOOTBALL LEAGUE</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f8;
      color: #111;
      text-align: center;
    }

    header {
      background: #111827;
      color: white;
      padding: 35px 15px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 17px;
    }

    .buttons {
      padding: 30px 15px;
    }

    button {
      width: 90%;
      max-width: 350px;
      padding: 16px;
      margin: 8px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .register {
      background: #16a34a;
      color: white;
    }

    .table {
      background: #2563eb;
      color: white;
    }

    .fixtures {
      background: #f59e0b;
      color: white;
    }

    .results {
      background: #7c3aed;
      color: white;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      background: #111827;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>🏆 eFOOTBALL LEAGUE</h1>
    <div class="subtitle">⚽ 1v1 Online Competition</div>
  </header>

  <div class="buttons">
    <button class="register">📝 JISAJILI</button>
    <button class="table">🏆 LEAGUE TABLE</button>
    <button class="fixtures">📅 FIXTURES</button>
    <button class="results">📊 RESULTS</button>
  </div>

  <footer>
    eFOOTBALL LEAGUE © 2026
  </footer>

</body>
</html>
